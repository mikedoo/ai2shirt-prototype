<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⑨a 设置 · 衣想工作室原型</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>9:41</span><span>●●●●● 100%</span></div>
  <div class="nav-bar">
    <span class="slot icon-back" data-go="back"></span>
    <span class="nav-title">设置</span>
    <span class="slot"></span>
  </div>
  <div class="page-body">
    <div class="section">
      <div class="section-title muted-title">服务支持</div>
      <div class="settings-group">
        <div class="settings-row clickable" data-toast="客服与售后">
          <span class="settings-label">客服与售后</span>
          <span class="settings-meta">在线咨询 · 退换货</span>
          <span class="settings-chevron">›</span>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title muted-title">购物</div>
      <div class="settings-group">
        <div class="settings-row clickable" data-toast="收货地址管理">
          <span class="settings-label">收货地址</span>
          <span class="settings-meta">3 个地址</span>
          <span class="settings-chevron">›</span>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title muted-title">账号设置</div>
      <div class="settings-group">
        <div class="settings-row clickable" data-toast="个人资料">
          <span class="settings-label">个人资料</span>
          <span class="settings-meta">昵称 · 头像</span>
          <span class="settings-chevron">›</span>
        </div>
        <div class="settings-row clickable" data-toast="账号与安全">
          <span class="settings-label">账号与安全</span>
          <span class="settings-meta">微信绑定 · 手机号</span>
          <span class="settings-chevron">›</span>
        </div>
        <div class="settings-row clickable" data-toast="消息通知">
          <span class="settings-label">消息通知</span>
          <span class="settings-meta">订单 · 共创</span>
          <span class="settings-chevron">›</span>
        </div>
        <div class="settings-row clickable" data-toast="隐私与权限">
          <span class="settings-label">隐私与权限</span>
          <span class="settings-meta">数据 · 授权</span>
          <span class="settings-chevron">›</span>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title muted-title">关于</div>
      <div class="settings-group">
        <div class="settings-row clickable" data-toast="关于衣想工作室">
          <span class="settings-label">关于</span>
          <span class="settings-meta">v0.3</span>
          <span class="settings-chevron">›</span>
        </div>
        <div class="settings-row clickable" data-toast="服务协议与隐私政策">
          <span class="settings-label">服务协议 · 隐私政策</span>
          <span class="settings-chevron">›</span>
        </div>
      </div>
    </div>

    <div class="section">
      <button class="btn btn-secondary" data-toast="已退出登录">退出登录</button>
    </div>
  </div>
</div>
<script src="../page.js"></script>
</body>
</html>

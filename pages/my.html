<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⑨ 我的 · 衣想工作室原型</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>9:41</span><span>●●●●● 100%</span></div>
  <div class="page-body">
    <div class="section my-header">
      <div class="row" style="gap:10px;">
        <div class="avatar"></div>
        <div>
          <div class="bold">用户昵称</div>
          <div class="muted">12 件作品 · 3 个共创 · 2 个订单</div>
        </div>
      </div>
      <div class="quick-icons">
        <button class="icon-btn" data-toast="消息中心">信</button>
        <button class="icon-btn" data-go="settings">设</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">作品库<span class="more" data-toast="筛选作品">筛选 ›</span></div>
      <div>
        <span class="chip active" data-chip-group="work-filter">全部</span>
        <span class="chip" data-chip-group="work-filter">个人</span>
        <span class="chip" data-chip-group="work-filter">共创</span>
        <span class="chip" data-chip-group="work-filter">编辑中</span>
      </div>
    </div>

    <div class="section col" style="padding-top:0;">
      <div class="asset-card clickable" data-go="editor">
        <div class="placeholder asset-cover">样衣</div>
        <div class="grow">
          <div class="row between">
            <span class="bold">毕业季复古插画 T</span>
            <span class="chip active" style="margin:0;">编辑中</span>
          </div>
          <div class="muted" style="margin-top:4px;">个人作品 · 已选候选 1 · 未下单</div>
          <div class="asset-actions">
            <button class="mini-btn" data-go="editor">继续编辑</button>
            <button class="mini-btn" data-go="cocreate">发起共创</button>
          </div>
        </div>
      </div>

      <div class="asset-card clickable" data-go="project-detail">
        <div class="placeholder asset-cover">共创</div>
        <div class="grow">
          <div class="row between">
            <span class="bold">软工 2026 毕业班服</span>
            <span class="chip" style="margin:0;">共创</span>
          </div>
          <div class="muted" style="margin-top:4px;">我发起的 · 28/35 已提交 · 待处理</div>
          <div class="asset-actions">
            <button class="mini-btn" data-go="project-detail">管理共创</button>
            <button class="mini-btn" data-go="projects">看全部</button>
          </div>
        </div>
      </div>

      <div class="asset-card clickable" data-go="order-detail">
        <div class="placeholder asset-cover">订单</div>
        <div class="grow">
          <div class="row between">
            <span class="bold">街舞社春季活动服</span>
            <span class="chip" style="margin:0;">已下单</span>
          </div>
          <div class="muted" style="margin-top:4px;">团队订单 · 18 件 · 生产中</div>
          <div class="asset-actions">
            <button class="mini-btn" data-go="order-detail">查看订单</button>
            <button class="mini-btn" data-go="editor">复用样衣</button>
          </div>
        </div>
      </div>

      <div class="asset-card clickable" data-go="editor">
        <div class="placeholder asset-cover">草稿</div>
        <div class="grow">
          <div class="row between">
            <span class="bold">社团招新极简 Logo T</span>
            <span class="chip" style="margin:0;">草稿</span>
          </div>
          <div class="muted" style="margin-top:4px;">对话草稿 · 已补充 Logo · 未生成最终样衣</div>
          <div class="asset-actions">
            <button class="mini-btn" data-go="create">继续创作</button>
            <button class="mini-btn" data-toast="删除草稿">删除</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab-item" data-go="home"><div class="tab-icon"></div>首页</div>
    <div class="tab-item" data-go="create"><div class="tab-icon"></div>创作</div>
    <div class="tab-item" data-go="projects"><div class="tab-icon"></div>共创</div>
    <div class="tab-item active"><div class="tab-icon"></div>我的</div>
  </div>
</div>
<script src="../page.js"></script>
</body>
</html>

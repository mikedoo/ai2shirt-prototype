<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⑤ 共创列表 · 衣想工作室原型</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>9:41</span><span>●●●●● 100%</span></div>
  <div class="nav-bar">
    <span class="slot"></span>
    <span class="nav-title">共创</span>
    <span class="slot center" data-go="create" data-toast="先创作或选择一件样衣，再发起共创">+</span>
  </div>
  <div class="topbar-tab">
    <div class="active" data-chip-group="proj-tab">我发起的</div>
    <div data-chip-group="proj-tab">我加入的</div>
  </div>
  <div class="section" style="padding:8px 12px;">
    <span class="chip active" data-chip-group="proj-status">全部</span>
    <span class="chip" data-chip-group="proj-status">创作中</span>
    <span class="chip" data-chip-group="proj-status">待下单</span>
    <span class="chip" data-chip-group="proj-status">生产中</span>
    <span class="chip" data-chip-group="proj-status">已发货</span>
  </div>
  <div class="page-body" style="padding:0 12px;">
    <div class="card clickable" style="margin-bottom:8px;" data-go="project-detail">
      <div class="row" style="gap:10px;">
        <div class="placeholder" style="width:64px;height:64px;flex-shrink:0;">封面</div>
        <div class="grow">
          <div class="bold">软工 2026 毕业班服</div>
          <div class="muted" style="margin:2px 0;">毕业季 · 35 人</div>
          <div class="row between" style="margin-top:6px;">
            <span class="chip active" style="margin:0;">待下单</span>
            <span class="tiny">28/35 已提交</span>
          </div>
        </div>
      </div>
    </div>
    <div class="card clickable" style="margin-bottom:8px;" data-go="project-detail">
      <div class="row" style="gap:10px;">
        <div class="placeholder" style="width:64px;height:64px;flex-shrink:0;">封面</div>
        <div class="grow">
          <div class="bold">街舞社春季活动服</div>
          <div class="muted" style="margin:2px 0;">社团服 · 18 人</div>
          <div class="row between" style="margin-top:6px;">
            <span class="chip" style="margin:0;">创作中</span>
            <span class="tiny">截止 5-15</span>
          </div>
        </div>
      </div>
    </div>
    <div class="card clickable" data-go="project-detail">
      <div class="row" style="gap:10px;">
        <div class="placeholder" style="width:64px;height:64px;flex-shrink:0;">封面</div>
        <div class="grow">
          <div class="bold">志愿者迎新 T</div>
          <div class="muted" style="margin:2px 0;">活动服 · 50 人</div>
          <div class="row between" style="margin-top:6px;">
            <span class="chip" style="margin:0;">生产中</span>
            <span class="tiny">预计 5-20 发货</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab-item" data-go="home"><div class="tab-icon"></div>首页</div>
    <div class="tab-item" data-go="create"><div class="tab-icon"></div>创作</div>
    <div class="tab-item active"><div class="tab-icon"></div>共创</div>
    <div class="tab-item" data-go="my"><div class="tab-icon"></div>我的</div>
  </div>
</div>
<script src="../page.js"></script>
</body>
</html>
